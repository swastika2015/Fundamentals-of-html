<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <fieldset>
        <legend>Enter your personal details</legend>
            
        <label>Name:</label>
        <br/>
        <input type="text"/>
        <br/>
        <br/>

        <label>Email:</label>
        <br/>
        <input type="email"/>
        <br/>
        <br/>

        <label>Mobile no:</label>
        <br/>
        <input type="number"/>
        <br/>
        <br/>

        <label>Gender:</label>
        <br/>
        <input type="radio" id="male" name="gender"/>
        <label for="male">Male</label>
        <br/>
        <input type="radio" id="female" name="gender"/>
        <label for="female">Female</label>
        <br/>
        <br/>

        <label>Hobbies:</label>
        <br/>
        <input type="checkbox" id="singing"/>
        <label for="singing" >singing</label>
        <br/>
        <input type="checkbox" id="playing-music"/>
        <label for="playing-music">playing music</label>
        <br/>
        <input type="checkbox" id="dancing"/>
        <label  for="dancing">dancing</label>
        <br/>
        <br/>

         <label>Birthday:</label>
        <br/>
        <input type="date"/>
        <br/>
        <br/>

        <label>Age:</label>
        <br/>
        <input type="number" min="0" max="100"/>
        <br/>
        <br/>

        <label>Grade group:</label>
        <br/>
        <select>
            <option></option>
            <option>1-3</option>
            <option>4-5</option>
            <option>6-8</option>
            <option>9-10</option>
            <option>11-12</option>
        </select>
        <br/>
        <br/>

        <button>submit</button>

    </fieldset>
        
        
        

    
    </form>
    
</body>
</html>
