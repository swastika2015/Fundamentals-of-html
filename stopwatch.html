<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h2>Stopwatch:</h2>
   <span id="seconds">00</span>
   <span>:</span>
   <span id="centisecond">00</span>
   <br>
   <br>
   <button id="btn-start">Start</button>
   <button id="btn-stop">Stop</button>
   <button id="btn-reset">Reset</button>
   <script>
    let seconds=0
    let centiseconds=0
    let spanCentisecond=document.getElementById("centisecond")
    let spanSecond=document.getElementById("seconds")
    function incrementTimer(){
        centiseconds=centiseconds+1
        spanCentisecond.innerText=String(centiseconds).padStart(2,'0')
        if (centiseconds >99){
       seconds=seconds+1
       spanSecond.innerText=String(seconds).padStart(2,'0')
       centiseconds=0
        }
       }
    let btnStart=document.getElementById("btn-start")
    btnStart.onclick=function(){
       timer=setInterval(incrementTimer,10)
      
    }

   
    let btnStop=document.getElementById("btn-stop")
    btnStop.onclick=function(){
      clearInterval(timer) 
      
    }

    
     let btnReset=document.getElementById("btn-reset")
    btnReset.onclick=function(){
      clearInterval(timer)
      spanCentisecond.innerText="00"
      centiseconds=0 
      spanSecond.innerText="00"
      seconds=0
    }
 
   </script>
</body>
</html>
